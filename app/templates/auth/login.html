<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FinFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-dk: #0F6E56; --green-lt: #E1F5EE;
      --border: #E2E0DA; --bg: #F7F6F2; --surface: #fff;
      --text: #2C2C2A; --text-muted: #888780;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 36px;
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 50px; height: 50px; background: var(--green);
      border-radius: 12px; display: inline-flex;
      align-items: center; justify-content: center;
      color: #fff; font-size: 24px; margin-bottom: 10px;
    }
    .auth-logo h1 { font-size: 22px; font-weight: 600; }
    .auth-logo p  { font-size: 13px; color: var(--text-muted); }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; display: block; }
    .form-control {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 14px;
      background: var(--surface); color: var(--text);
    }
    .form-control:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,0.1); }
    .btn-full {
      width: 100%; padding: 10px;
      background: var(--green); color: #fff;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: 8px; transition: background 0.15s;
    }
    .btn-full:hover { background: var(--green-dk); }
    .auth-footer { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 20px; }
    .auth-footer a { color: var(--green); text-decoration: none; font-weight: 500; }
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .alert-danger { background: #FCEBEB; color: #993C1D; border: 1px solid #F7C1C1; }
    .divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 16px 0; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      width: 44%; height: 1px; background: var(--border);
    }
    .divider::before { left: 0; } .divider::after { right: 0; }
    label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-bolt"></i></div>
      <h1>Welcome back</h1>
      <p>Sign in to your FinFlow account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <label class="check">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="#" style="font-size:12px;color:var(--green);text-decoration:none;">Forgot password?</a>
      </div>
      <button type="submit" class="btn-full"><i class="ti ti-login"></i> Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.signup') }}">Create one free</a>
    </div>
  </div>
</body>
</html>
