<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — FinFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --green:#1D9E75;--green-dk:#0F6E56;--border:#E2E0DA;--bg:#F7F6F2;--surface:#fff;--text:#2C2C2A;--text-muted:#888780; }
    body { font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px; }
    .auth-card { width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px; }
    .auth-logo { text-align:center;margin-bottom:24px; }
    .logo-icon { width:50px;height:50px;background:var(--green);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:24px;margin-bottom:10px; }
    .auth-logo h1 { font-size:22px;font-weight:600; }
    .auth-logo p  { font-size:13px;color:var(--text-muted); }
    .form-group { margin-bottom:14px; }
    .form-label { font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:5px;display:block; }
    .form-control { width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text); }
    .form-control:focus { outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,0.1); }
    .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
    .btn-full { width:100%;padding:10px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:background 0.15s; }
    .btn-full:hover { background:var(--green-dk); }
    .auth-footer { text-align:center;font-size:13px;color:var(--text-muted);margin-top:20px; }
    .auth-footer a { color:var(--green);text-decoration:none;font-weight:500; }
    .alert { padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px; }
    .alert-danger { background:#FCEBEB;color:#993C1D;border:1px solid #F7C1C1; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-bolt"></i></div>
      <h1>Create your account</h1>
      <p>Start managing your finances today — free forever</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" name="name" class="form-control" placeholder="Arjun Kumar" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min 8 chars" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Repeat" required>
        </div>
      </div>
      <button type="submit" class="btn-full"><i class="ti ti-user-plus"></i> Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</body>
</html>
